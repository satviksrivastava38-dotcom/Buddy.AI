<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy.AI — Your smart workspace</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f5ff,#101018);--surface:light-dark(#fff,#191923);--surface2:light-dark(#f4f1ff,#222230);--text:light-dark(#282344,#f5f3ff);--muted:light-dark(#7e7991,#aaa6bd);--line:light-dark(#e9e5f5,#333244);--purple:#6c4cff;--shadow:0 12px 35px #39247712}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg);border-radius:0}.topbar{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:var(--surface)}.brand{display:flex;align-items:center;gap:13px}.logo{height:48px;width:48px;border-radius:15px;background:var(--purple);display:grid;place-items:center;color:white;font-size:25px;font-weight:800;box-shadow:0 8px 20px #6c4cff40}.brand h1{font-size:21px;margin:0;letter-spacing:-.6px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:10px}.iconbtn,.avatar{border:1px solid var(--line);background:var(--surface);color:var(--text);height:39px;min-width:39px;border-radius:12px;display:grid;place-items:center}.avatar{border-radius:50%;background:#ece6ff;color:#5b43ca;font-weight:800}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 84px)}aside{padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}.workspace-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);padding:8px 12px 12px}.nav{display:flex;align-items:center;gap:11px;padding:11px 12px;margin:3px 0;border-radius:11px;border:0;background:transparent;color:var(--muted);width:100%;text-align:left;font-size:13px}.nav span{font-size:17px;width:21px;text-align:center}.nav:hover,.nav.active{background:light-dark(#eee9ff,#2a2445);color:var(--purple);font-weight:650}.side-bottom{margin-top:28px;padding:15px;border-radius:15px;background:linear-gradient(145deg,#775bff,#a18bff);color:white}.side-bottom b{font-size:13px}.side-bottom p{font-size:11px;line-height:1.5;opacity:.9}.side-bottom button{background:white;color:#6043df;border:0;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:700}.main{padding:27px clamp(16px,3vw,38px) 40px;max-width:1500px;width:100%;margin:auto}.greeting{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--muted);font-size:12px;margin:0 0 8px}.greeting h2{font-size:clamp(23px,3vw,32px);letter-spacing:-1px;margin:0 0 6px}.gradient-text{background:linear-gradient(90deg,#6d4cff,#23b8bb);-webkit-background-clip:text;background-clip:text;color:transparent}.greeting p{margin:0;color:var(--muted);font-size:13px}.primary,.secondary{border:0;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:700}.primary{background:var(--purple);color:white;box-shadow:0 7px 16px #6c4cff25}.secondary{background:var(--surface);border:1px solid var(--line);color:var(--text)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.stat,.panel,.feature{background:var(--surface);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:17px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{height:31px;width:31px;border-radius:10px;display:grid;place-items:center;background:var(--surface2)}.stat strong{display:block;font-size:27px;letter-spacing:-1px;margin:10px 0 3px}.stat small{font-size:11px;color:#21a67a}.content-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:17px}.column{display:grid;gap:17px;align-content:start}.panel{padding:19px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.panel-head h3{font-size:15px;margin:0}.muted{color:var(--muted)}.tiny{font-size:11px}.task-row{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.task-row:last-child{border-bottom:0}.check{height:17px;width:17px;accent-color:var(--purple);flex-shrink:0}.task-info{flex:1;min-width:0}.task-info b{font-size:12px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task-info small{font-size:10px;color:var(--muted)}.pill{padding:5px 8px;border-radius:7px;font-size:10px;background:var(--surface2);white-space:nowrap}.pill.purple{background:#eee9ff;color:#6748e8}.progress-row{margin:15px 0}.progress-title{display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px}.bar{height:6px;border-radius:20px;background:var(--surface2);overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,#7453ff,#4dc8c2);border-radius:20px}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.feature{padding:17px;cursor:pointer;transition:transform .15s,border-color .15s;box-shadow:none;text-align:left;color:var(--text)}.feature:hover{transform:translateY(-2px);border-color:#b6a8ff}.feature .ficon{height:38px;width:38px;display:grid;place-items:center;border-radius:12px;background:var(--surface2);font-size:20px;margin-bottom:13px}.feature b{display:block;font-size:13px;margin-bottom:5px}.feature p{font-size:11px;color:var(--muted);line-height:1.5;margin:0}.event{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface2);border-radius:12px;margin-bottom:10px}.datebox{height:42px;width:42px;display:grid;place-items:center;background:var(--surface);border-radius:10px;color:var(--purple);font-size:12px;font-weight:800}.event b{font-size:12px;display:block}.event small{font-size:10px;color:var(--muted)}.event .dots{margin-left:auto;color:var(--muted)}.chatbox{display:flex;gap:8px;margin-top:13px}.chatbox input,.field{min-width:0;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:12px;font-size:12px;outline:none}.chatbox input:focus,.field:focus{border-color:#9b88ff}.chat-log{max-height:180px;overflow:auto;display:grid;gap:9px}.bubble{font-size:12px;line-height:1.55;padding:10px 12px;border-radius:12px;background:var(--surface2);max-width:92%;white-space:pre-wrap}.bubble.user{justify-self:end;background:#eee9ff;color:#332267}.view-title{font-size:24px;margin:4px 0 6px}.view-desc{color:var(--muted);font-size:13px;margin:0 0 22px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.file-list{display:grid;gap:9px}.file-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:13px}.file-emoji{height:37px;width:37px;border-radius:10px;background:var(--surface2);display:grid;place-items:center}.file-item div:nth-child(2){flex:1;min-width:0}.file-item b{font-size:12px;display:block}.file-item small{font-size:10px;color:var(--muted)}.file-item button{border:0;background:transparent;color:var(--muted)}.empty{color:var(--muted);font-size:12px;text-align:center;padding:24px}.password-value{font-family:monospace;letter-spacing:2px}.notice{font-size:11px;color:var(--muted);line-height:1.6;background:var(--surface2);padding:12px;border-radius:10px;margin-top:13px}.modal-back{position:fixed;inset:0;background:#100b2488;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-back.show{display:flex}.modal{width:min(450px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 25px 80px #0004}.modal h3{margin:0 0 6px}.modal p{color:var(--muted);font-size:12px;line-height:1.6}.formstack{display:grid;gap:11px;margin:17px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:22px;right:22px;padding:12px 16px;background:#242035;color:white;border-radius:12px;font-size:12px;box-shadow:0 10px 30px #0003;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateY(0)}.mobile-menu{display:none}
@media(max-width:900px){.layout{grid-template-columns:75px minmax(0,1fr)}aside{padding:18px 9px}.workspace-label,.nav .label,.side-bottom{display:none}.nav{justify-content:center;padding:12px 5px}.nav span{font-size:19px}.content-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.topbar{height:72px;padding:0 15px}.layout{min-height:calc(100vh - 72px);grid-template-columns:1fr}.layout aside{position:fixed;bottom:0;left:0;right:0;z-index:5;height:64px;border-right:0;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:5px;background:var(--surface)}.nav{margin:0;flex:1}.nav:nth-of-type(n+6){display:none}.main{padding:22px 14px 86px}.greeting{align-items:center}.greeting .primary{padding:10px;font-size:11px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.quick-grid{gap:9px}.panel{padding:15px}.brand h1{font-size:19px}.brand p{font-size:11px}}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">✳</div><div><h1>Buddy.AI</h1><p>Your smart workspace</p></div></div><div class="top-actions"><button class="iconbtn" id="themeBtn" title="Toggle appearance">☼</button><button class="iconbtn" id="notifyBtn" title="Notifications">♧</button><button class="avatar" id="profileBtn" title="Profile">S</button></div></header>
<div class="layout"><aside><div class="workspace-label">Workspace</div><button class="nav active" data-view="home"><span>⌂</span><i class="label">Home</i></button><button class="nav" data-view="ai"><span>✧</span><i class="label">AI Buddy</i></button><button class="nav" data-view="tasks"><span>☷</span><i class="label">My tasks</i></button><button class="nav" data-view="files"><span>▱</span><i class="label">File manager</i></button><button class="nav" data-view="planner"><span>▦</span><i class="label">Planner</i></button><button class="nav" data-view="passwords"><span>♢</span><i class="label">Passwords</i></button><button class="nav" data-view="printing"><span>▤</span><i class="label">Print manager</i></button><button class="nav" data-view="solver"><span>⌁</span><i class="label">Task solver</i></button><div class="side-bottom"><b>✦ Make room for great work</b><p>Your ideas, files and plans — together in one calm workspace.</p><button id="inviteBtn">＋ Invite a teammate</button></div></aside>
<main class="main" id="main"></main></div></div>
<div class="modal-back" id="modalBack"><div class="modal"><h3 id="modalTitle">Add item</h3><p id="modalDesc"></p><div class="formstack" id="modalFields"></div><div class="modal-actions"><button class="secondary" id="modalCancel">Cancel</button><button class="primary" id="modalSave">Save</button></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
let tasks=[{title:'Review project brief',meta:'Product launch · Today',done:false,priority:'High'},{title:'Send summary to the team',meta:'Team operations · Today',done:false,priority:'Normal'},{title:'Prepare presentation slides',meta:'Client meeting · Tomorrow',done:true,priority:'Normal'}];
let files=[{name:'Project brief.pdf',type:'PDF document',size:'2.4 MB',icon:'📕'},{name:'Meeting notes.docx',type:'Word document',size:'840 KB',icon:'📘'},{name:'Q4 budget.xlsx',type:'Spreadsheet',size:'1.2 MB',icon:'📗'}];let passwords=[];let events=[{day:'18',month:'OCT',title:'Weekly team sync',time:'10:00 – 10:30 AM'},{day:'20',month:'OCT',title:'Project milestone review',time:'2:00 – 3:00 PM'},{day:'22',month:'OCT',title:'Focus time',time:'9:00 – 11:00 AM'}];let prints=[];let current='home';let chat=[{who:'bot',text:'Hey there! 👋 I’m Buddy, your AI work companion. What can I help you with today?'}];
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function modal(title,desc,fields,save){$('#modalTitle').textContent=title;$('#modalDesc').textContent=desc||'';$('#modalFields').innerHTML=fields.map((f,i)=>`<label class="tiny muted">${f.label}<input class="field" id="mf${i}" placeholder="${f.placeholder||''}" ${f.type==='password'?'type="password"':''} ${f.type==='date'?'type="date"':''} ${f.required===false?'':'required'}></label>`).join('');$('#modalBack').classList.add('show');$('#modalSave').onclick=()=>{let vals=fields.map((f,i)=>$('#mf'+i).value.trim());if(fields.some((f,i)=>f.required!==false&&!vals[i])){toast('Please complete the required fields.');return}save(vals);$('#modalBack').classList.remove('show')};$('#modalCancel').onclick=()=>$('#modalBack').classList.remove('show')}
function taskMarkup(t,i){return `<div class="task-row"><input class="check" type="checkbox" data-task="${i}" ${t.done?'checked':''}><div class="task-info"><b style="${t.done?'text-decoration:line-through;opacity:.55':''}">${esc(t.title)}</b><small>${esc(t.meta)}</small></div><span class="pill ${t.priority==='High'?'purple':''}">${t.priority}</span></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){let done=tasks.filter(t=>t.done).length;return `<section class="greeting"><div><p class="eyebrow">SATURDAY, OCTOBER 17</p><h2>Good morning! <span class="gradient-text">Ready to make progress?</span></h2><p>Your day, your files, your ideas — all in one place.</p></div><button class="primary" data-action="ask">✧ Ask Buddy AI</button></section><section class="stats"><div class="stat"><div class="stat-top">Tasks in progress <span class="stat-icon">☷</span></div><strong>${tasks.filter(t=>!t.done).length.toString().padStart(2,'0')}</strong><small>↗ Keep your momentum</small></div><div class="stat"><div class="stat-top">Files organized <span class="stat-icon">▱</span></div><strong>${files.length.toString().padStart(2,'0')}</strong><small>✓ Workspace ready</small></div><div class="stat"><div class="stat-top">Upcoming events <span class="stat-icon">▦</span></div><strong>${events.length.toString().padStart(2,'0')}</strong><small>On your planner</small></div><div class="stat"><div class="stat-top">Tasks completed <span class="stat-icon">✦</span></div><strong>${done}</strong><small>${tasks.length?Math.round(done/tasks.length*100):0}% of your task list</small></div></section><div class="content-grid"><div class="column"><section class="panel"><div class="panel-head"><h3>My tasks</h3><button class="secondary" data-action="addtask">＋ Add task</button></div><div>${tasks.length?tasks.map(taskMarkup).join(''):'<div class="empty">No tasks yet. Add your first task to get started.</div>'}</div><button class="secondary" style="width:100%;margin-top:12px" data-view="tasks">View all tasks →</button></section><section class="panel"><div class="panel-head"><h3>Quick access</h3><span class="tiny muted">Your daily tools</span></div><div class="quick-grid"><button class="feature" data-view="ai"><span class="ficon">✧</span><b>AI Buddy</b><p>Chat, write, summarize and brainstorm.</p></button><button class="feature" data-view="files"><span class="ficon">📁</span><b>File manager</b><p>Keep your documents organized.</p></button><button class="feature" data-view="solver"><span class="ficon">☷</span><b>Task solver</b><p>Turn big goals into small steps.</p></button><button class="feature" data-view="printing"><span class="ficon">▤</span><b>Print manager</b><p>Prepare and track print jobs.</p></button></div></section></div><div class="column"><section class="panel"><div class="panel-head"><h3>Planner & reminders</h3><button class="secondary" data-view="planner">Open planner →</button></div>${events.slice(0,3).map(e=>`<div class="event"><div class="datebox"><div>${e.day}</div><small>${e.month}</small></div><div><b>${esc(e.title)}</b><small>${esc(e.time)}</small></div><span class="dots">•••</span></div>`).join('')}<button class="secondary" style="width:100%;margin-top:3px" data-action="addevent">＋ Schedule an event</button></section><section class="panel"><div class="panel-head"><h3>Ask Buddy</h3><span class="pill purple">AI assistant</span></div><div class="chat-log">${chat.slice(-2).map(m=>`<div class="bubble ${m.who==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div><form class="chatbox" id="miniChat"><input name="message" placeholder="What would you like help with?" required><button class="primary">Send ↗</button></form></section></div></div>`}
function pageHead(title,desc,button,action){return `<h2 class="view-title">${title}</h2><p class="view-desc">${desc}</p><div class="toolbar">${button?`<button class="primary" data-action="${action}">＋ ${button}</button>`:''}<button class="secondary" data-view="home">← Dashboard</button></div>`}
function viewPage(){if(current==='home')return home();if(current==='ai')return `${pageHead('AI Buddy','A friendly space to think, write, plan and solve problems.')}<section class="panel"><div class="panel-head"><h3>✧ Chat with Buddy</h3><span class="pill purple">Ready to help</span></div><div class="chat-log" id="fullChat" style="min-height:210px;max-height:430px">${chat.map(m=>`<div class="bubble ${m.who==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div><form class="chatbox" id="fullChatForm"><input name="message" placeholder="Ask me to draft an email, summarize notes, brainstorm…" required><button class="primary">Send ↗</button></form><p class="notice">Prototype mode: Buddy uses built-in demo responses. Connect a trusted AI service to enable live AI replies.</p></section>`;if(current==='tasks')return `${pageHead('My tasks','Keep track of priorities and celebrate progress.','Add task','addtask')}<section class="panel"><div class="panel-head"><h3>Task list</h3><span class="pill">${tasks.filter(t=>!t.done).length} remaining</span></div>${tasks.length?tasks.map(taskMarkup).join(''):'<div class="empty">Your task list is clear. Add a task whenever you need.</div>'}</section>`;if(current==='files')return `${pageHead('File manager','A simple home for your important documents.','Upload file','upload')}<section class="panel"><div class="toolbar"><input id="fileSearch" class="field" style="max-width:330px" placeholder="Search files…"><label class="secondary" style="display:flex;align-items:center;gap:8px">Choose file<input type="file" id="fileInput" style="max-width:150px;font-size:11px"></label></div><div id="fileList" class="file-list">${fileMarkup()}</div><p class="notice">Demo files are stored in this page session. Files you choose are listed locally; they are not uploaded to a server.</p></section>`;if(current==='planner')return `${pageHead('Planner','Make space for the work that matters.','Add event','addevent')}<section class="panel"><div class="panel-head"><h3>Upcoming schedule</h3><span class="pill purple">October 2026</span></div>${events.length?events.map(e=>`<div class="event"><div class="datebox"><div>${e.day}</div><small>${e.month}</small></div><div><b>${esc(e.title)}</b><small>${esc(e.time)}</small></div><button class="secondary" data-delete-event="${events.indexOf(e)}">Remove</button></div>`).join(''):'<div class="empty">No events scheduled yet.</div>'}</section>`;if(current==='passwords')return `${pageHead('Password manager','Keep a personal list of credentials for this prototype.','Add credential','addpassword')}<section class="panel"><h3 style="margin-top:0">Saved credentials</h3>${passwords.length?passwords.map((p,i)=>`<div class="file-item"><div class="file-emoji">🔐</div><div><b>${esc(p.site)}</b><small>${esc(p.username)} · <span class="password-value">${p.show?esc(p.password):'••••••••'}</span></small></div><button data-reveal="${i}">${p.show?'Hide':'Show'}</button><button data-delete-password="${i}">×</button></div>`).join(''):'<div class="empty">No credentials added. Add a demo credential to explore the interface.</div>'}<p class="notice">Security note: this is a front-end demo, not a secure vault. Do not enter real passwords. Production use needs encrypted storage, authentication and security review.</p></section>`;if(current==='printing')return `${pageHead('Print manager','Prepare a print job and track its status.','New print job','addprint')}<section class="panel"><div class="panel-head"><h3>Print queue</h3><span class="pill">${prints.length} jobs</span></div>${prints.length?prints.map((p,i)=>`<div class="file-item"><div class="file-emoji">🖨️</div><div><b>${esc(p.name)}</b><small>${p.pages} page(s) · ${p.copies} copy/copies · ${esc(p.color)}</small></div><span class="pill">${esc(p.status)}</span><button data-finish-print="${i}">✓</button></div>`).join(''):'<div class="empty">Your print queue is empty. Create a job to get started.</div>'}<p class="notice">Print jobs are simulated in this demo; no physical printer is connected.</p></section>`;if(current==='solver')return `${pageHead('Task solver','Break a big or fuzzy goal into manageable next steps.')}<section class="panel"><h3 style="margin-top:0">What are you working on?</h3><p class="muted tiny">Describe your goal and Buddy will create a practical starter plan.</p><textarea class="field" id="goalInput" rows="4" placeholder="e.g. Prepare a presentation for Friday’s team meeting"></textarea><div class="toolbar" style="margin-top:12px"><button class="primary" id="solveBtn">✧ Break it down</button></div><div id="solution"></div></section>`;return home()}
function fileMarkup(){return files.length?files.map((f,i)=>`<div class="file-item" data-fname="${esc(f.name.toLowerCase())}"><div class="file-emoji">${f.icon}</div><div><b>${esc(f.name)}</b><small>${esc(f.type)} · ${esc(f.size)}</small></div><button data-delete-file="${i}" title="Remove">×</button></div>`).join(''):'<div class="empty">No files yet. Add a file to get started.</div>'}
function render(){ $('#main').innerHTML=viewPage();$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===current));bindPage()}
function navigate(v){current=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function bindPage(){$$('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$$('[data-task]').forEach(c=>c.onchange=()=>{tasks[+c.dataset.task].done=c.checked;render()});$$('[data-delete-file]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.deleteFile,1);render();toast('File removed')});$$('[data-delete-event]').forEach(b=>b.onclick=()=>{events.splice(+b.dataset.deleteEvent,1);render()});$$('[data-delete-password]').forEach(b=>b.onclick=()=>{passwords.splice(+b.dataset.deletePassword,1);render()});$$('[data-reveal]').forEach(b=>b.onclick=()=>{let p=passwords[+b.dataset.reveal];p.show=!p.show;render()});$$('[data-finish-print]').forEach(b=>{b.onclick=()=>{prints[+b.dataset.finishPrint].status='Ready';render();toast('Print job marked ready')}});let mini=$('#miniChat');if(mini)mini.onsubmit=e=>{e.preventDefault();sendChat(new FormData(mini).get('message'));render()};let full=$('#fullChatForm');if(full)full.onsubmit=e=>{e.preventDefault();sendChat(new FormData(full).get('message'));render();setTimeout(()=>$('#fullChat')?.scrollTo({top:99999,behavior:'smooth'}),20)};let fi=$('#fileInput');if(fi)fi.onchange=()=>{if(fi.files[0]){let f=fi.files[0];files.push({name:f.name,type:f.type||'File',size:f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB',icon:'📄'});render();toast('File added to this session')}};let fs=$('#fileSearch');if(fs)fs.oninput=()=>$$('[data-fname]').forEach(el=>el.style.display=el.dataset.fname.includes(fs.value.toLowerCase())?'flex':'none');let solve=$('#solveBtn');if(solve)solve.onclick=()=>solveGoal()}
function action(a){if(a==='ask'){navigate('ai');return}if(a==='addtask')modal('Add a task','Give your next action a clear name.',[{label:'Task name',placeholder:'e.g. Review project proposal'},{label:'Due date or context',placeholder:'e.g. Tomorrow · Team project',required:false}],v=>{tasks.unshift({title:v[0],meta:v[1]||'Personal task',done:false,priority:'Normal'});render();toast('Task added')});if(a==='addevent')modal('Schedule an event','Add a reminder to your planner.',[{label:'Event name',placeholder:'e.g. Project check-in'},{label:'Date',type:'date'},{label:'Time',placeholder:'e.g. 10:30 AM'}],v=>{let d=new Date(v[1]+'T12:00:00');events.push({day:v[1].slice(-2),month:d.toLocaleString('en',{month:'short'}).toUpperCase(),title:v[0],time:v[2]||'Time not set'});render();toast('Event added')});if(a==='upload')$('#fileInput')?.click();if(a==='addpassword')modal('Add credential','Use fictional details only. This prototype is not a secure vault.',[{label:'Website or app',placeholder:'Example app'},{label:'Username',placeholder:'demo@example.com'},{label:'Password',placeholder:'Demo password',type:'password'}],v=>{passwords.push({site:v[0],username:v[1],password:v[2],show:false});render();toast('Credential added to this session')});if(a==='addprint')modal('New print job','Create a simulated print job.',[{label:'Document name',placeholder:'e.g. Meeting agenda.pdf'},{label:'Number of pages',placeholder:'1',type:'number'},{label:'Copies',placeholder:'1',type:'number'},{label:'Color mode',placeholder:'Black & white or Color'}],v=>{prints.unshift({name:v[0],pages:Math.max(1,+v[1]||1),copies:Math.max(1,+v[2]||1),color:v[3]||'Black & white',status:'Queued'});render();toast('Print job queued')})}
function sendChat(text){text=String(text||'').trim();if(!text)return;chat.push({who:'user',text});let t=text.toLowerCase(),reply;if(/hello|hi\b|hey/.test(t))reply='Hey! 👋 What would you like to make progress on today?';else if(/email|write|draft/.test(t))reply='Absolutely — here’s a useful starting structure:\n\nSubject: [Clear topic]\n\nHi [Name],\n\nI’m reaching out about [purpose]. [Add the key details and any context.]\n\nCould you please [specific next step] by [date]?\n\nThanks,\n[Your name]\n\nShare the audience and tone, and you can tailor this draft.';else if(/summari|summary/.test(t))reply='Paste your notes or text here and I can help turn them into a concise summary with key points, decisions, and action items.';else if(/plan|organ|priorit/.test(t))reply='Try this simple plan:\n1. Define the outcome you need.\n2. List the smallest next actions.\n3. Choose the most important action first.\n4. Block focused time on your planner.\n5. Review progress at the end of the day.';else if(/idea|brainstorm/.test(t))reply='Let’s brainstorm! Start with three angles: make it simpler, make it more useful for the audience, or combine two existing ideas in a new way. Tell me your topic and I’ll suggest more specific options.';else reply='I can help you structure that. Try defining the desired outcome, splitting it into small actions, and deciding what “done” looks like. For a more tailored answer, add a little context or paste the material you’re working with.\n\nNote: this preview uses demo responses rather than a live AI model.';chat.push({who:'bot',text:reply})}
function solveGoal(){let goal=$('#goalInput').value.trim();if(!goal){toast('Describe your goal first');return}let steps=['Define the outcome and what success looks like.','Gather the information, files or people you need.','Break the work into 3–5 small actions.','Complete the highest-impact action first.','Review the result and note the next step.'];$('#solution').innerHTML=`<div class="panel" style="margin-top:16px;background:var(--surface2)"><h3>Suggested plan for: ${esc(goal)}</h3>${steps.map((s,i)=>`<div class="task-row"><span class="datebox" style="height:30px;width:30px">${i+1}</span><div class="task-info"><b>${s}</b></div><button class="secondary" data-add-step="${i}">＋ Task</button></div>`).join('')}</div>`;$$('[data-add-step]').forEach(b=>b.onclick=()=>{tasks.push({title:steps[+b.dataset.addStep],meta:goal,done:false,priority:'Normal'});toast('Step added to My tasks')})}
$$('.nav').forEach(n=>n.onclick=()=>navigate(n.dataset.view));$('#themeBtn').onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==='light'?'dark':'light';d.style.colorScheme=d.dataset.theme;toast(d.dataset.theme==='dark'?'Dark appearance':'Light appearance')};$('#notifyBtn').onclick=()=>toast(tasks.filter(t=>!t.done).length+' tasks still in progress');$('#profileBtn').onclick=()=>modal('Your profile','A local demo profile.',[{label:'Display name',placeholder:'Your name'}],v=>{if(v[0]){$('#profileBtn').textContent=v[0][0].toUpperCase();toast('Profile updated for this session')}});$('#inviteBtn').onclick=()=>modal('Invite a teammate','Sharing is simulated in this prototype.',[{label:'Teammate email',placeholder:'teammate@example.com'}],()=>toast('Demo invite prepared'));render();
</script></body></html>
